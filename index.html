<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>🏎️ FPP Racing — Menu + Garaż</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #000;
      --accent: #ffa500;
      --accent-dark: #ff6600;
      --text: #fff;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #menu, #garage, #game {
      position: absolute;
      inset: 0;
      display: none;
    }
    #menu.active, #garage.active, #game.active {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    button {
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--accent);
      padding: 10px 25px;
      margin: 8px;
      font-size: 18px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    button:hover {
      background: var(--accent);
      color: #000;
      box-shadow: 0 0 20px var(--accent-dark);
    }
    #canvas3d {
      width: 100%;
      height: 100%;
      display: block;
    }
    #overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      padding: 8px 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="menu" class="active">
    <h1 style="color:var(--accent)">🏁 FPP Racing</h1>
    <button id="startRace">Start wyścigu</button>
    <button id="garageBtn">Garaż</button>
    <button id="exitBtn">Wyjście</button>
  </div>

  <div id="garage">
    <canvas id="canvas3d"></canvas>
    <div id="overlay">
      <h3>🚗 Garaż</h3>
      <p id="status">Wczytywanie...</p>
      <button id="backToMenu">Powrót</button>
    </div>
  </div>

  <div id="game">
    <h2 style="color:white;">🚧 Tryb wyścigu w budowie 🚧</h2>
    <button id="backFromGame">Powrót do menu</button>
  </div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.156.0/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.156.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://unpkg.com/three@0.156.0/examples/jsm/loaders/GLTFLoader.js';

    const menu = document.getElementById('menu');
    const garage = document.getElementById('garage');
    const game = document.getElementById('game');
    const status = document.getElementById('status');

    // Przycisk nawigacji
    document.getElementById('garageBtn').onclick = () => switchScreen(garage);
    document.getElementById('startRace').onclick = () => switchScreen(game);
    document.getElementById('exitBtn').onclick = () => alert("Gra zamknięta (symulacja)");
    document.getElementById('backToMenu').onclick = () => switchScreen(menu);
    document.getElementById('backFromGame').onclick = () => switchScreen(menu);

    function switchScreen(screen) {
      [menu, garage, game].forEach(s => s.classList.remove('active'));
      screen.classList.add('active');
    }

    // === GARAŻ 3D ===
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(2, 1.5, 4);

    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true });
    renderer.setSize(innerWidth, innerHeight);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.3);
    scene.add(hemiLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const loader = new GLTFLoader();
    loader.load(
      'models/car1.glb', // zmień nazwę na własną
      (gltf) => {
        scene.add(gltf.scene);
        status.innerText = "Model załadowany ✅";
      },
      (xhr) => {
        status.innerText = "Ładowanie: " + Math.round(xhr.loaded / xhr.total * 100) + "%";
      },
      (error) => {
        status.innerText = "❌ Błąd ładowania modelu!";
        console.error(error);
      }
    );

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
